<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Canvas</title>
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <header class="header">
        <div class="header-copy">
          <p class="eyebrow">Map Canvas</p>
          <h1 id="title">地図を読み込んでいます</h1>
        </div>
        <div class="header-actions">
          <button id="reset-view" class="toolbar-button" type="button">全体表示</button>
          <button
            id="diagnostics"
            class="toolbar-button diagnostics-button"
            type="button"
            aria-expanded="false"
            aria-controls="diagnostics-panel"
            title="実行時診断"
          >
            <span aria-hidden="true">診</span>
            <span class="diagnostics-label">診断</span>
          </button>
          <button
            id="display-mode"
            class="toolbar-button display-mode-button"
            type="button"
            aria-pressed="false"
            aria-label="地図を最大化"
            title="地図を最大化"
            hidden
          >
            <span class="display-mode-icon" aria-hidden="true">⤢</span>
            <span class="display-mode-label">最大化</span>
          </button>
          <span id="count" class="count"></span>
        </div>
      </header>
      <section
        id="diagnostics-panel"
        class="diagnostics-panel"
        aria-labelledby="diagnostics-title"
        hidden
      >
        <div class="diagnostics-heading">
          <div>
            <strong id="diagnostics-title">実行時診断</strong>
            <span id="diagnostics-status">待機中</span>
          </div>
          <button id="diagnostics-close" class="diagnostics-close" type="button" aria-label="閉じる">×</button>
        </div>
        <p>
          最大化前後のデータ配送、表示モード、要素サイズ、Leaflet状態、例外を記録します。
          地点名や座標は送信しません。
        </p>
        <pre id="diagnostics-log" class="diagnostics-log">診断イベントはまだありません。</pre>
        <div class="diagnostics-actions">
          <button id="diagnostics-fullscreen" class="diagnostics-primary" type="button">最大化を診断</button>
          <button id="diagnostics-send" class="diagnostics-secondary" type="button">現在の結果を送信</button>
        </div>
      </section>
      <nav id="days" class="days" aria-label="日別表示" hidden></nav>
      <div class="content">
        <section class="map-frame">
          <div id="map" aria-label="インタラクティブ地図"></div>
          <div id="loading" class="loading">地図データを待っています…</div>
        </section>
        <aside class="itinerary" aria-label="旅程">
          <div class="itinerary-heading">
            <strong>旅程</strong>
            <span>地点を選択</span>
          </div>
          <ol id="places" class="places" aria-label="地点一覧"></ol>
        </aside>
      </div>
      <footer>
        <span id="route-note">地点を選ぶと詳細を表示</span>
        <span>© OpenStreetMap contributors</span>
      </footer>
    </main>
    <script type="module" src="./src.ts"></script>
  </body>
</html>
